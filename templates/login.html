<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body class="pagina pagina--login">
  <main class="tarjeta tarjeta--login">
    <header class="encabezado">
      <h1>Bienvenido</h1>
      <p class="subtitulo">Inicia sesión para continuar</p>
    </header>

    <form id="login-form" method="post" action="/auth/login" autocomplete="on">
      <div class="campo">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" name="email"
               placeholder="demo@example.com" autocomplete="username" required />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••" autocomplete="current-password" required />
      </div>

      <button type="submit" id="submit-btn" class="boton boton--primario">
        <span class="btn-text">Entrar</span>
        <span class="spinner" aria-hidden="true"></span>
      </button>

      <p id="message" class="mensaje" role="alert" aria-live="polite"></p>
    </form>

    <div class="recuperar-enlace">
      <a href="/recuperar" class="enlace-recuperar">¿Olvidaste tu contraseña?</a>
    </div>

    <footer class="pie">
      <p><strong>Demo:</strong> demo@example.com / demo1234</p>
      <p><strong>Supervisor:</strong> supervisor@example.com / super1234</p>
      <p><strong>Admin:</strong> admin@example.com / admin1234</p>
      <p><strong>learning</strong>   learning@example.com /  learning1234</p>
    </footer>
  </main>

  <script src="/static/login.js"></script>
</body>
</html>
