<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cámara Virtual — {{ camera_id }}</title>
<style>
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: #0d0f12; color: #e8eaed;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; overflow: hidden;
  }
  header {
    width: 100%; padding: 14px 20px; background: #16191e;
    border-bottom: 1px solid #262c34; display: flex;
    justify-content: space-between; align-items: center;
    box-sizing: border-box;
  }
  .cam-id { color: #00dc78; font-weight: 700; letter-spacing: .5px; }
  .cam-id::before { content: '● '; animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: 0.25; } }
  .meta { font-size: 12px; color: #8a93a0; }
  #wrap {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; box-sizing: border-box; width: 100%;
  }
  img#feed {
    max-width: 100%; max-height: 100%;
    border: 1px solid #262c34; border-radius: 6px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.5);
    background: #000;
  }
  footer {
    width: 100%; padding: 10px 20px; background: #16191e;
    border-top: 1px solid #262c34; font-size: 12px;
    color: #8a93a0; text-align: center; box-sizing: border-box;
  }
  footer code { color: #00dc78; }
</style>
</head>
<body>
  <header>
    <div class="cam-id">{{ camera_id }}</div>
    <div class="meta">Vista cenital · MJPEG sobre HTTP · Puerto 8080</div>
  </header>
  <div id="wrap">
    <img id="feed" src="/video.mjpg" alt="Flujo de cámara" />
  </div>
  <footer>
    Flujo MJPEG: <code id="url"></code>
    &nbsp;|&nbsp;
    Snapshot: <code id="snap-url"></code>
  </footer>
  <script>
    const base = `${location.protocol}//${location.host}`;
    document.getElementById('url').textContent = base + '/video.mjpg';
    document.getElementById('snap-url').textContent = base + '/snapshot.jpg';
  </script>
</body>
</html>
